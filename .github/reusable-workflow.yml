name: reuseable-workflow
on:
  workflow_call:
    inputs:
      ingress-url:
        required: true
        description: 'Provide the Ingress URL'
        type: string
  jobs:
    integration-test:
      runs-on: ubuntu-latest
      steps:
        - env:
            URL: '${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}'
          run: |
            curl ${{ ingress-url }} -s -k | jq -r .status | grep -i live
